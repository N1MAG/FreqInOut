
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqinout"
version = "2.0.0"
description = "HF Radio Frequency and Net Control Utility"
readme = "README.md"
authors = [{ name = "Bill Daniel" }]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9,<3.14"
dependencies = [
  "PySide6==6.8.1.1",
  "PySide6-Essentials==6.8.1.1",
  "PySide6-Addons==6.8.1.1",
  "bleak>=0.22.0",
  "psutil>=5.9.0",
  "requests>=2.31.0",
  "pytz>=2023.3",
  "tzdata>=2024.1",
  "keyring>=25.0",
  "reportlab>=4.0",
]

[project.scripts]
freqinout = "freqinout.main:main"

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["freqinout*"]
