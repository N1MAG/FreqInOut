
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqinout"
version = "1.2.5"
description = "HF Radio Frequency and Net Control Utility"
readme = "README.md"
authors = [{ name = "Bill Daniel" }]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9,<3.14"
dependencies = [
  "requests>=2.31.0",
  "pytz>=2023.3",
  "psutil>=5.9.0",
  "PySide6>=6.7.0",
  "keyring>=25.0",
  "reportlab>=4.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
freqinout = "freqinout.main:main"

[tool.setuptools.packages.find]
include = ["freqinout*"]
