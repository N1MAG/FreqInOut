name: Build and Publish Release

run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v') && format('FreqInOut {0} production release', github.ref_name) || format('FreqInOut package candidates from {0}', github.ref_name) }}

on:
  workflow_dispatch:
  push:
    branches:
      - "release/public-*-candidate"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: public-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    name: Verify immutable release inputs
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      production: ${{ steps.mode.outputs.production }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Identify build mode
        id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate metadata and compile packaging tools
        id: version
        shell: bash
        run: |
          expected_tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="$GITHUB_REF"
          fi
          python packaging/verify_release_inputs.py \
            --expected-tag "$expected_tag" \
            --github-output "$GITHUB_OUTPUT"
          python -m compileall -q freqinout packaging

      - name: Confirm production tag belongs to public main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Production tag does not point to a commit on public main." >&2
            exit 1
          }

  windows-candidate:
    name: Windows x86-64 unsigned package
    if: needs.verify.outputs.production == 'false' || vars.FIO_ENABLE_PFX_SIGNING != 'true'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/build-requirements.txt
          python -m pip freeze --all | Set-Content windows-dependencies.txt -Encoding utf8

      - name: Build frozen application
        shell: pwsh
        run: |
          python packaging/verify_release_inputs.py
          python build_executable.py

      - name: Smoke-test unpacked application
        shell: pwsh
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}\fio-unpacked-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          $process = Start-Process -FilePath ".\dist\FreqInOut\FreqInOut.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Unpacked smoke test failed: $($process.ExitCode)" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          Copy-Item ".\Output\FreqInOut-Setup.exe" ".\FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup-unsigned.exe"

      - name: Install, launch, and uninstall completed installer
        shell: pwsh
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}\fio-installed-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          $installer = Resolve-Path ".\FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup-unsigned.exe"
          $installDir = Join-Path "${{ runner.temp }}" "FreqInOutInstalled"
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          New-Item -ItemType Directory -Force -Path $env:FREQINOUT_CONFIG_DIR | Out-Null
          Set-Content (Join-Path $env:FREQINOUT_CONFIG_DIR "retain-after-uninstall.txt") "retain"
          $smoke = Start-Process -FilePath (Join-Path $installDir "FreqInOut.exe") -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed smoke test failed: $($smoke.ExitCode)" }
          $uninstall = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:FREQINOUT_CONFIG_DIR "retain-after-uninstall.txt"))) {
            throw "Windows uninstall removed operator profile data"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $asset = "FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup-unsigned.exe"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Retain Windows candidate for three days
        if: needs.verify.outputs.production == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-candidate
          path: |
            FreqInOut-*-windows-x86_64-setup-unsigned.exe
            FreqInOut-*-windows-x86_64-setup-unsigned.exe.sha256
            windows-dependencies.txt
          if-no-files-found: error
          retention-days: 3

      - name: Attest unsigned Windows installer provenance
        if: needs.verify.outputs.production == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup-unsigned.exe

      - name: Upload unsigned Windows release assets
        if: needs.verify.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freqinout-release-windows-x86_64
          path: |
            FreqInOut-*-windows-x86_64-setup-unsigned.exe
            FreqInOut-*-windows-x86_64-setup-unsigned.exe.sha256
            windows-dependencies.txt
          if-no-files-found: error
          retention-days: 90

  windows-release:
    name: Windows x86-64 signed release
    if: needs.verify.outputs.production == 'true' && vars.FIO_ENABLE_PFX_SIGNING == 'true'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Require Windows signing credential
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured" }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured" }

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/build-requirements.txt
          python -m pip freeze --all | Set-Content windows-dependencies.txt -Encoding utf8

      - name: Build and smoke-test frozen application
        shell: pwsh
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}\fio-unpacked-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          python packaging/verify_release_inputs.py --expected-tag "$env:GITHUB_REF"
          python build_executable.py
          $smoke = Start-Process -FilePath ".\dist\FreqInOut\FreqInOut.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Unpacked smoke test failed: $($smoke.ExitCode)" }

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "freqinout-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate) { throw "Windows signing certificate import failed" }
          "thumbprint=$($certificate.Thumbprint)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign frozen executable
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows signtool.exe was not found" }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $env:CERT_THUMBPRINT ".\dist\FreqInOut\FreqInOut.exe"
          if ($LASTEXITCODE -ne 0) { throw "Executable signing failed: $LASTEXITCODE" }
          & $signtool.FullName verify /pa /all /v ".\dist\FreqInOut\FreqInOut.exe"
          if ($LASTEXITCODE -ne 0) { throw "Executable signature verification failed: $LASTEXITCODE" }

      - name: Build and sign Windows installer
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $asset = ".\FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup.exe"
          Copy-Item ".\Output\FreqInOut-Setup.exe" $asset
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $env:CERT_THUMBPRINT $asset
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed: $LASTEXITCODE" }
          & $signtool.FullName verify /pa /all /v $asset
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed: $LASTEXITCODE" }

      - name: Install, launch, and uninstall signed installer
        shell: pwsh
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}\fio-installed-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          $installer = Resolve-Path ".\FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup.exe"
          $installDir = Join-Path "${{ runner.temp }}" "FreqInOutInstalled"
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          New-Item -ItemType Directory -Force -Path $env:FREQINOUT_CONFIG_DIR | Out-Null
          Set-Content (Join-Path $env:FREQINOUT_CONFIG_DIR "retain-after-uninstall.txt") "retain"
          $smoke = Start-Process -FilePath (Join-Path $installDir "FreqInOut.exe") -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed smoke test failed: $($smoke.ExitCode)" }
          $uninstall = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:FREQINOUT_CONFIG_DIR "retain-after-uninstall.txt"))) {
            throw "Windows uninstall removed operator profile data"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $asset = "FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup.exe"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Attest Windows installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: FreqInOut-${{ needs.verify.outputs.version }}-windows-x86_64-setup.exe

      - name: Upload signed Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freqinout-release-windows-x86_64
          path: |
            FreqInOut-*-windows-x86_64-setup.exe
            FreqInOut-*-windows-x86_64-setup.exe.sha256
            windows-dependencies.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove imported signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          Remove-Item "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP "freqinout-signing.pfx") -Force -ErrorAction SilentlyContinue

  linux:
    name: Linux amd64 Debian package
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            desktop-file-utils dpkg-dev libdbus-1-3 libegl1 libgl1 libglib2.0-0 \
            libxkbcommon-x11-0 libxcb-cursor0 xvfb

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/build-requirements.txt
          python -m pip freeze --all > linux-dependencies.txt

      - name: Build and smoke-test frozen application
        run: |
          expected_tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then expected_tag="$GITHUB_REF"; fi
          python packaging/verify_release_inputs.py --expected-tag "$expected_tag"
          python -m PyInstaller --noconfirm --clean FreqInOut.spec
          profile="${{ runner.temp }}/fio-unpacked-smoke"
          mkdir -p "$profile"
          env FREQINOUT_CONFIG_DIR="$profile" FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV=1 \
            QT_QPA_PLATFORM=offscreen FREQINOUT_HARD_EXIT=0 \
            xvfb-run -a ./dist/FreqInOut/FreqInOut --smoke-test

      - name: Build, install, launch, and remove Debian package
        run: |
          desktop-file-validate packaging/linux/freqinout.desktop
          python packaging/build_linux_deb.py --output-dir Output
          dpkg-deb --info Output/FreqInOut-*-linux-amd64.deb
          sudo apt-get install --yes ./Output/FreqInOut-*-linux-amd64.deb
          profile="${{ runner.temp }}/fio-installed-smoke"
          mkdir -p "$profile"
          printf 'retain\n' > "$profile/retain-after-uninstall.txt"
          env FREQINOUT_CONFIG_DIR="$profile" FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV=1 \
            QT_QPA_PLATFORM=offscreen FREQINOUT_HARD_EXIT=0 \
            xvfb-run -a /usr/bin/freqinout --smoke-test
          sudo apt-get remove --yes freqinout
          test -f "$profile/retain-after-uninstall.txt"
          test ! -e /usr/bin/freqinout

      - name: Generate checksum
        run: |
          cd Output
          asset="FreqInOut-${{ needs.verify.outputs.version }}-linux-amd64.deb"
          sha256sum "$asset" > "$asset.sha256"

      - name: Attest Debian package provenance
        if: needs.verify.outputs.production == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Output/FreqInOut-${{ needs.verify.outputs.version }}-linux-amd64.deb

      - name: Retain Debian candidate
        if: needs.verify.outputs.production == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FreqInOut-${{ needs.verify.outputs.version }}-linux-amd64-candidate
          path: |
            Output/FreqInOut-*-linux-amd64.deb
            Output/FreqInOut-*-linux-amd64.deb.sha256
            linux-dependencies.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload Debian release assets
        if: needs.verify.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freqinout-release-linux-amd64
          path: |
            Output/FreqInOut-*-linux-amd64.deb
            Output/FreqInOut-*-linux-amd64.deb.sha256
            linux-dependencies.txt
          if-no-files-found: error
          retention-days: 90

  macos-candidate:
    name: macOS ${{ matrix.arch }} unsigned package
    if: needs.verify.outputs.production == 'false' || vars.FIO_ENABLE_APPLE_SIGNING != 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/build-requirements.txt
          python -m pip freeze --all > "macos-${{ matrix.arch }}-dependencies.txt"

      - name: Create native application icon
        shell: bash
        run: |
          iconset="$RUNNER_TEMP/FreqInOut.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/FreqInOut_logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/FreqInOut_logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o assets/FreqInOut.icns

      - name: Build and smoke-test application bundle
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}/fio-unpacked-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          python packaging/verify_release_inputs.py
          python -m PyInstaller --noconfirm --clean FreqInOut.spec
          codesign --verify --deep --strict --verbose=2 dist/FreqInOut.app
          dist/FreqInOut.app/Contents/MacOS/FreqInOut --smoke-test

      - name: Build and verify disk image
        run: |
          python packaging/build_macos_dmg.py --output-dir Output
          mv "Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}.dmg" \
            "Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg"
          hdiutil verify "Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg"

      - name: Install and launch completed disk image
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}/fio-installed-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          dmg="Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg"
          mount="$RUNNER_TEMP/freqinout-volume-${{ matrix.arch }}"
          install_root="$RUNNER_TEMP/freqinout-applications-${{ matrix.arch }}"
          mkdir -p "$mount" "$install_root" "$FREQINOUT_CONFIG_DIR"
          printf 'retain\n' > "$FREQINOUT_CONFIG_DIR/retain-after-uninstall.txt"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach -quiet "$mount" || true' EXIT
          ditto "$mount/FreqInOut.app" "$install_root/FreqInOut.app"
          "$install_root/FreqInOut.app/Contents/MacOS/FreqInOut" --smoke-test
          rm -rf "$install_root/FreqInOut.app"
          test -f "$FREQINOUT_CONFIG_DIR/retain-after-uninstall.txt"
          hdiutil detach -quiet "$mount"
          trap - EXIT

      - name: Generate checksum
        run: |
          cd Output
          asset="FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg"
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Retain macOS candidate for three days
        if: needs.verify.outputs.production == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}-candidate
          path: |
            Output/FreqInOut-*-macos-${{ matrix.arch }}-unsigned.dmg
            Output/FreqInOut-*-macos-${{ matrix.arch }}-unsigned.dmg.sha256
            macos-${{ matrix.arch }}-dependencies.txt
          if-no-files-found: error
          retention-days: 3

      - name: Attest unsigned macOS disk image provenance
        if: needs.verify.outputs.production == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg

      - name: Upload unsigned macOS release assets
        if: needs.verify.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freqinout-release-macos-${{ matrix.arch }}
          path: |
            Output/FreqInOut-*-macos-${{ matrix.arch }}-unsigned.dmg
            Output/FreqInOut-*-macos-${{ matrix.arch }}-unsigned.dmg.sha256
            macos-${{ matrix.arch }}-dependencies.txt
          if-no-files-found: error
          retention-days: 90

  macos-release:
    name: macOS ${{ matrix.arch }} signed and notarized release
    if: needs.verify.outputs.production == 'true' && vars.FIO_ENABLE_APPLE_SIGNING == 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Require Apple signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            test -n "${!name}" || { echo "$name is not configured" >&2; exit 1; }
          done

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/build-requirements.txt
          python -m pip freeze --all > "macos-${{ matrix.arch }}-dependencies.txt"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "freqinout-signing.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_BASE64"])
          )
          PY
          keychain="$RUNNER_TEMP/freqinout-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$RUNNER_TEMP/freqinout-signing.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$RUNNER_TEMP" "$keychain"

      - name: Create native application icon
        run: |
          iconset="$RUNNER_TEMP/FreqInOut.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/FreqInOut_logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/FreqInOut_logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o assets/FreqInOut.icns

      - name: Build signed application bundle
        env:
          FIO_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}/fio-unpacked-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          python packaging/verify_release_inputs.py --expected-tag "$GITHUB_REF"
          python -m PyInstaller --noconfirm --clean FreqInOut.spec
          codesign --verify --deep --strict --verbose=2 dist/FreqInOut.app
          spctl --assess --type execute --verbose=2 dist/FreqInOut.app
          dist/FreqInOut.app/Contents/MacOS/FreqInOut --smoke-test

      - name: Build, sign, notarize, and staple disk image
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python packaging/build_macos_dmg.py --output-dir Output
          dmg="Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], f"AuthKey_{os.environ['NOTARY_KEY_ID']}.p8").write_bytes(
              base64.b64decode(os.environ["NOTARY_KEY_BASE64"])
          )
          PY
          key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"

      - name: Install and launch notarized disk image
        env:
          FREQINOUT_CONFIG_DIR: ${{ runner.temp }}/fio-installed-smoke
          FREQINOUT_ALLOW_EXTERNAL_RUNTIME_ENV: "1"
          QT_QPA_PLATFORM: offscreen
          FREQINOUT_HARD_EXIT: "0"
        run: |
          dmg="Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          mount="$RUNNER_TEMP/freqinout-volume-${{ matrix.arch }}"
          install_root="$RUNNER_TEMP/freqinout-applications-${{ matrix.arch }}"
          mkdir -p "$mount" "$install_root" "$FREQINOUT_CONFIG_DIR"
          printf 'retain\n' > "$FREQINOUT_CONFIG_DIR/retain-after-uninstall.txt"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach -quiet "$mount" || true' EXIT
          ditto "$mount/FreqInOut.app" "$install_root/FreqInOut.app"
          spctl --assess --type execute --verbose=2 "$install_root/FreqInOut.app"
          "$install_root/FreqInOut.app/Contents/MacOS/FreqInOut" --smoke-test
          rm -rf "$install_root/FreqInOut.app"
          test -f "$FREQINOUT_CONFIG_DIR/retain-after-uninstall.txt"
          hdiutil detach -quiet "$mount"
          trap - EXIT

      - name: Generate checksum
        run: |
          cd Output
          asset="FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Attest macOS disk image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Output/FreqInOut-${{ needs.verify.outputs.version }}-macos-${{ matrix.arch }}.dmg

      - name: Upload notarized macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freqinout-release-macos-${{ matrix.arch }}
          path: |
            Output/FreqInOut-*-macos-${{ matrix.arch }}.dmg
            Output/FreqInOut-*-macos-${{ matrix.arch }}.dmg.sha256
            macos-${{ matrix.arch }}-dependencies.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/freqinout-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/freqinout-signing.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: Publish immutable GitHub Release
    if: >-
      always() &&
      needs.verify.outputs.production == 'true' &&
      needs.verify.result == 'success' &&
      (needs.windows-candidate.result == 'success' || needs.windows-release.result == 'success') &&
      needs.linux.result == 'success' &&
      (needs.macos-candidate.result == 'success' || needs.macos-release.result == 'success')
    needs:
      - verify
      - windows-candidate
      - windows-release
      - linux
      - macos-candidate
      - macos-release
    runs-on: ubuntu-22.04
    environment:
      name: production-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: freqinout-release-*
          path: release-assets
          merge-multiple: true

      - name: Verify individual checksums and create combined checksum
        run: |
          cd release-assets
          for checksum in FreqInOut-*.sha256; do
            sha256sum --check "$checksum"
          done
          find . -maxdepth 1 -type f \( -name 'FreqInOut-*.exe' -o -name 'FreqInOut-*.deb' -o -name 'FreqInOut-*.dmg' \) \
            -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4

      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          WINDOWS_SIGNED: ${{ vars.FIO_ENABLE_PFX_SIGNING }}
          MACOS_SIGNED: ${{ vars.FIO_ENABLE_APPLE_SIGNING }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          notes_args=()
          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            notes_args+=(--windows-signed)
          fi
          if [[ "$MACOS_SIGNED" == "true" ]]; then
            notes_args+=(--macos-signed)
          fi
          python packaging/build_release_notes.py \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-notes.md" \
            "${notes_args[@]}"

          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "FreqInOut $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" \
            release-assets/FreqInOut-*.exe \
            release-assets/FreqInOut-*.deb \
            release-assets/FreqInOut-*.dmg \
            release-assets/FreqInOut-*.sha256 \
            release-assets/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
